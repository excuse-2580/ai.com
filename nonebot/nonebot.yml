import os

# NoneBot 运行配置
SUPERUSERS: list = os.getenv("SUPERUSERS", "").split(",") if os.getenv("SUPERUSERS") else ["123456"]
# 123456 替换为你的QQ号作为超级管理员

COMMAND_START: list = {""}
HOST: str = os.getenv("HOST", "0.0.0.0")
